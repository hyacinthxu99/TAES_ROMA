[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roma-tsad"
version = "0.3.0"
description = "ROMA model components for adapting time-series anomaly detection backbones"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "torch>=2.0", "torch-geometric>=2.3"]

[project.optional-dependencies]
experiments = ["pandas>=1.5", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
include = ["roma*"]
